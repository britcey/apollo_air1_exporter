version: '3.8'

services:
  apollo_air1_exporter:
    build: .
    image: apollo_air1_exporter
    container_name: apollo_air1_exporter
    restart: unless-stopped
    ports:
      - "9926:9926"
    environment:
      - APOLLO_LOG_LEVEL=info
    networks:
      - monitoring

networks:
  monitoring:
    external: true