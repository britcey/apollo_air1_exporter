name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: Check
        run: make check
      - name: Build
        run: make build

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        thread: [0, 1]
    steps:
      - uses: prometheus/promci/build@872d318d090d73df349cb6ed90aadd072ca478f7 # v0.10.0
        with:
          parallelism: 2
          thread: ${{ matrix.thread }}

  publish-release:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: prometheus/promci/publish_release@872d318d090d73df349cb6ed90aadd072ca478f7 # v0.10.0
        with:
          github_token: ${{ github.token }}

  publish-images:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set build metadata
        id: build-metadata
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d-%H:%M:%S)" >> "$GITHUB_OUTPUT"
      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            britcey/apollo_air1_exporter
            ghcr.io/britcey/apollo_air1_exporter
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push multi-architecture images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build-metadata.outputs.version }}
            REVISION=${{ github.sha }}
            BRANCH=${{ github.ref_name }}
            BUILD_USER=${{ github.actor }}@github.com
            BUILD_DATE=${{ steps.build-metadata.outputs.date }}